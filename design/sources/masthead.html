<meta charset="utf-8">
<style>
  :root{ --ink:#0B0910; --violet:#8E44FF; --yellow:#FFE814; --paper:#F0EDF7; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);
    font-family:'TeX Gyre Heros',sans-serif;overflow:hidden}
  .stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;
    justify-content:space-between;padding:0 78px}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(to right,rgba(142,68,255,.10) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(142,68,255,.10) 1px,transparent 1px);
    background-size:36px 36px}
  .glow{position:absolute;width:820px;height:820px;left:-230px;top:-390px;border-radius:50%;
    background:radial-gradient(circle,rgba(142,68,255,.34),rgba(142,68,255,0) 62%)}
  .glow2{position:absolute;width:560px;height:560px;right:-90px;bottom:-300px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,232,20,.13),rgba(255,232,20,0) 62%)}
  .z{position:relative;z-index:2}

  .slash{position:relative;z-index:2;flex:none;width:21px;height:340px;
    transform:skewX(-22.8deg)}
  .slash b{position:absolute;top:0;bottom:0;width:3px;display:block}
  .slash b:nth-child(1){left:0;background:linear-gradient(to bottom,rgba(142,68,255,0),rgba(142,68,255,.62) 46%,rgba(142,68,255,0))}
  .slash b:nth-child(2){left:18px;background:linear-gradient(to bottom,rgba(255,232,20,0),rgba(255,232,20,.46) 46%,rgba(255,232,20,0))}

  .left img{display:block}
  .oneline{display:flex;align-items:center;gap:24px;margin-top:30px;margin-left:7px}
  .stylerow{display:flex;gap:9px}
  .pen{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    background:#15121C;border:1px solid rgba(142,68,255,.42);color:#E4DEF2;
    font-family:'TeX Gyre Adventor',sans-serif;font-weight:700;font-size:22px;
    clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
  .pen.on{background:#FFE814;border-color:#FFE814;color:#0B0910}
  .pen svg{width:22px;height:22px;display:block}
  .pen i{font-style:italic}
  .pen .st{position:relative}
  .pen .st:after{content:"";position:absolute;left:-5px;right:-5px;top:50%;height:2.5px;
    background:currentColor;transform:translateY(-50%)}
  .pen .chip3{position:absolute;left:7px;right:7px;bottom:5px;height:2px;background:#8E44FF}
  .sw{display:flex;align-items:center;gap:8px}
  .sw i{width:24px;height:24px;border-radius:5px;display:block}

  .right{text-align:left}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:27px;line-height:1}
  .before{color:#B7AFC8}
  .before em{font-style:normal;background:rgba(142,68,255,.38);padding:6px 3px}
  .after{margin-top:26px;margin-left:30px}
  .band{background:var(--yellow);color:#0B0910;padding:8px 14px;display:inline-block;
    clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%)}
</style>
<div class="stage">
  <div class="grid"></div><div class="glow"></div><div class="glow2"></div>

  <div class="z left">
    <img src="../../brand/wordmark-on-dark.svg" width="720">
    <div class="oneline">
      <div class="stylerow">
        <div class="pen on"><svg viewBox="0 0 64 64"><path d="M22 18 H56 L44 29 H10 Z" fill="#0B0910"/><path d="M22 35 H56 L44 46 H10 Z" fill="#0B0910" opacity=".45"/></svg></div>
        <div class="pen"><b>B</b></div>
        <div class="pen"><i>I</i></div>
        <div class="pen"><u>U</u></div>
        <div class="pen"><span class="st">S</span></div>
        <div class="pen"><svg viewBox="0 0 24 24" fill="none" stroke="#E4DEF2" stroke-width="1.9"><path d="M12 21a9 9 0 1 1 0-18c4.97 0 9 3.58 9 8 0 2.5-2 4-4.5 4H14a2 2 0 0 0-1.4 3.4A1.6 1.6 0 0 1 12 21Z"/><circle cx="8" cy="9.5" r="1.15" fill="#E4DEF2" stroke="none"/><circle cx="12" cy="7" r="1.15" fill="#E4DEF2" stroke="none"/><circle cx="16" cy="9.5" r="1.15" fill="#E4DEF2" stroke="none"/></svg><em class="chip3"></em></div>
      </div>
      <div class="sw">
        <i style="background:#FFE814"></i><i style="background:#7BF59B"></i><i style="background:#4FE8E0"></i>
        <i style="background:#6BB8FF"></i><i style="background:#FF7AB8"></i><i style="background:#FFA53D"></i>
        <i style="width:13px"></i>
        <i style="background:#E01B24"></i><i style="background:#F57C00"></i><i style="background:#00B8B0"></i>
        <i style="background:#1A73E8"></i><i style="background:#00A152"></i><i style="background:#8E44FF"></i>
      </div>
    </div>
  </div>

  <div class="slash"><b></b><b></b></div>

  <div class="z right">
    <div class="mono before"><em>this is worth keeping</em></div>
    <div class="mono after"><span class="band">==this is worth keeping==</span></div>
  </div>
</div>
