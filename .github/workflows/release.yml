name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      - name: Verify tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          echo "tag:      $TAG"
          echo "manifest: $MANIFEST_VERSION"

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error title=Version mismatch::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            echo "Obsidian release tags carry no 'v' prefix - the tag must be exactly '$MANIFEST_VERSION'."
            echo "Fix it with:  git tag -d $TAG && git push --delete origin $TAG"
            exit 1
          fi

          if ! node -e "process.exit(require('./versions.json')['$TAG'] ? 0 : 1)"; then
            echo "::error title=versions.json missing entry::versions.json has no key '$TAG'."
            echo "Add \"$TAG\": \"<minAppVersion>\" to versions.json, or Obsidian cannot resolve this release."
            exit 1
          fi

          echo "Version check passed."

      - name: Build highlight-pen-${{ github.ref_name }}.zip
        run: |
          mkdir -p "dist/highlight-pen"
          cp main.js manifest.json styles.css "dist/highlight-pen/"
          cd dist
          zip -r "../highlight-pen-${GITHUB_REF_NAME}.zip" "highlight-pen"
          cd ..
          unzip -l "highlight-pen-${GITHUB_REF_NAME}.zip"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(main.js manifest.json styles.css "highlight-pen-${GITHUB_REF_NAME}.zip")

          # `gh release create` fails outright if the release already exists,
          # which turns any re-run of a successful job into a red X. Upload
          # over the top instead so re-running is always safe.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists - replacing its assets."
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

      - name: Confirm assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
